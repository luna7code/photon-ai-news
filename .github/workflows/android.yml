name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android theme resource
        run: test -f app/src/main/res/values/styles.xml && grep -q 'Theme.PhotonAINews' app/src/main/res/values/styles.xml
      - name: Run editorial intelligence unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-ai-news-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
